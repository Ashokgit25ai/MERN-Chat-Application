services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: mern-chat-server

    env_file:
      - ./server/.env

    ports:
      - "5000:3300"

    restart: unless-stopped


  client:
    build: 
      context: ./client
      dockerfile: Dockerfile

    container_name: mern-chat-client

    ports:
      - "3000:80"
    
    depends_on:
      - server

    restart: unless-stopped

